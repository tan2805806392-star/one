<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生产管理</title>
<style>
:root{
  --bg:#f4f6f3;--card:#fff;--card2:#f0f3ec;--line:#dce2d6;
  --text:#1a2b20;--sub:#6b7c70;--accent:#296b48;--accent-l:#e5eee7;
  --accent-d:#1b4d32;--deep:#1e382a;--danger:#c05c5c;--danger-l:#fbefef;
  --pink:#ffb6c1;--orange:#d97706;--orange-l:#fffaf0;
  --gray:#9ca3af;--gray-bg:#f3f4f6;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
.app{width:100%;max-width:500px;margin:0 auto;padding-bottom:20px;}
.top-nav-wrap{background:var(--deep);padding:8px 12px;position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.15);}
.nav-icons{display:flex;gap:6px;flex:1;position:relative;}
.nav-indicator{position:absolute;top:0;left:0;height:48px;width:0;border-radius:8px;background:var(--accent);transition:left .28s cubic-bezier(.34,.9,.4,1),width .28s cubic-bezier(.34,.9,.4,1);z-index:0;pointer-events:none;}
.nav-icons button{flex:1;height:36px;border:none;border-radius:8px;background:transparent;color:#a2c4af;font-size:13px;font-weight:700;cursor:pointer;transition:color .25s;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;}
.nav-icons button.active{color:#fff;}
.at-btn{width:36px;height:36px;border-radius:8px;border:none;background:rgba(255,255,255,.08);color:#fff;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-left:6px;}
.at-btn:active{background:rgba(255,255,255,.2);}
.page{display:none;padding:12px;}
.page.active{display:block;}
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.03);margin-bottom:10px}
.card.tight{padding:10px}
.lbl{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .full{grid-column:1/-1}
.field label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px;align-items:center}
input,select,textarea{width:100%;padding:0 10px;font-size:16px;font-weight:700;background:var(--card2);border:1px solid transparent;border-radius:8px;color:var(--text);outline:none;transition:.3s;font-family:var(--font);}
input,select{height:40px;}
textarea{min-height:70px;padding:10px;font-size:14px;font-weight:600;line-height:1.5;resize:vertical;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff}
input.highlight-pink{background:#fff0f2;border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,182,193,.4);}
.clear{font-size:11px;color:#fff;background:var(--danger);border:none;border-radius:4px;padding:3px 8px;cursor:pointer;font-weight:700;}
.hero{background:var(--deep);border-radius:16px;padding:16px;color:#fff;margin-bottom:10px;box-shadow:0 6px 20px rgba(30,56,42,.2);position:relative;}
.hero .copy-btn{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:4px;}
.hero .copy-btn.done{background:var(--accent);border-color:var(--accent)}
.hero .copy-btn:disabled{opacity:.5;}
.hero h1{font-size:12px;font-weight:500;color:#a2c4af;margin-bottom:2px}
.hero .big{font-size:52px;font-weight:800;line-height:1.1;margin-bottom:10px;letter-spacing:-1px}
.hero .stop-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.hero .stop-lbl{font-size:13px;color:#d1e0d7}
.hero .stop-v{font-size:20px;font-weight:800;color:#f3d67b}
.hero .bottom-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8fa898}
.hero .bottom-row .val{font-size:13px;font-weight:700;color:#fff;margin-left:4px}
.now{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;background:var(--card2);border-radius:8px;cursor:pointer;border:1px solid transparent;transition:all 0.1s;}
.now:active{transform:scale(0.96);background:#e5ebe1;}
.now .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.now .lbl{font-size:12px;font-weight:600;color:var(--sub);margin:0}
.now .tm{margin-left:auto;font-size:18px;font-weight:800;color:var(--text)}
.now .rf{font-size:11px;color:var(--accent);background:#fff;padding:3px 8px;border-radius:6px;font-weight:700;transition:all 0.1s;}
@keyframes flashGreen {0% { background-color: rgba(41,107,72,0.3); }100% { background-color: transparent; }}
.record-flash {animation: flashGreen 0.3s ease-out;}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.quick button{flex:0 0 calc(25% - 4.5px);height:32px;border-radius:6px;background:var(--card2);border:none;color:var(--text);font-size:14px;font-weight:700;cursor:pointer;}
.quick button.on{background:var(--accent);color:#fff}
.actions{display:flex;gap:10px;margin-bottom:10px}
.actions button{flex:1;height:44px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;border:none}
.btn-reset{background:var(--danger);border:none;color:#fff;}
.btn-record{background:var(--accent);color:#fff;}
.drawer{background:transparent;margin-bottom:10px;}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 4px;}
.drawer-head .t{font-size:15px;font-weight:700;color:var(--text);}
.drawer-head .clr{font-size:13px;color:var(--danger);background:none;border:none;cursor:pointer;}
.hitem{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.03);position:relative;border-left:4px solid var(--accent);transition:all .3s;}
.hitem.warn-orange{border-left-color:var(--orange);background:var(--orange-l);}
.hitem.warn-orange,.hitem.warn-orange *{color:var(--orange)!important;}
.hitem.warn-orange .cell{background:#fff0db;}
.hitem.warn-red{border-left-color:var(--danger);background:#fff5f5;}
.hitem.warn-red,.hitem.warn-red *{color:var(--danger)!important;}
.hitem.warn-red .cell{background:var(--danger-l);}
.hitem.is-done{border-left-color:var(--gray);background:var(--gray-bg);opacity:0.8;box-shadow:none;}
.hitem.is-done,.hitem.is-done *{color:var(--gray)!important;}
.hitem.is-done .cell{background:#e5e7eb;}
.stamp-done{position:absolute;right:16px;bottom:16px;width:64px;height:64px;border-radius:50%;border:3px solid var(--danger);color:var(--danger)!important;font-size:14px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;justify-content:center;transform:rotate(-15deg);opacity:0.85;pointer-events:none;z-index:10;background:transparent;}
.hitem .header-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:8px;font-weight:500;padding-right:28px;transition:color .3s;}
.hitem .header-row .line-tag{font-weight:800;font-size:14px;}
.hitem .header-row b{font-weight:800;}
.hitem .hgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
.hitem .cell{background:#f6f9f4;border-radius:8px;padding:6px 4px;text-align:center;transition:all .3s;}
.hitem .cell .k{font-size:11px;display:block;margin-bottom:2px;font-weight:500;transition:color .3s;}
.hitem .cell .v{font-size:17px;font-weight:900;letter-spacing:-0.5px;transition:color .3s;}
.hitem .cell.pick{cursor:pointer;border:1px dashed #b8d9c2;}
.hitem .cell.pick .v{text-decoration:underline;text-underline-offset:3px;}
.hitem .hmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;font-weight:700;transition:color .3s;}
.hitem .del{position:absolute;top:10px;right:10px;width:24px;height:24px;line-height:22px;text-align:center;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:16px;cursor:pointer;font-weight:400;z-index:10;}
.nt-result{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.04);margin-bottom:10px;border-left:4px solid var(--accent);}
.nt-result h1{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}
.nt-preview{font-size:16px;font-weight:600;line-height:1.6;color:var(--text);background:var(--card2);border-radius:8px;padding:10px;min-height:56px;word-break:break-all;white-space:pre-wrap;}
.nt-preview .hl{color:var(--accent);font-weight:800}
.nt-preview .ph{color:var(--sub);font-weight:500;font-size:14px}
.big-copy{width:100%;height:40px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(41,107,72,.3);margin-bottom:10px;display:flex;align-items:center;justify-content:center;}
.big-copy.done{background:var(--accent-d)}
.big-copy:disabled{background:#d0d8d2;color:#fff;cursor:not-allowed;box-shadow:none;}
.circle-nums{display:flex;gap:12px;justify-content:space-between;margin-bottom:6px}
.circle-num{width:46px;height:46px;border-radius:50%;border:none;background:var(--card2);color:var(--text);font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.circle-num.on{background:var(--accent);color:#fff;box-shadow:0 4px 10px rgba(41,107,72,.3)}
.single-display{display:flex;justify-content:space-between;align-items:center;height:40px;padding:0 12px;background:var(--card2);border-radius:8px;cursor:pointer;border:1px solid transparent;}
.single-display .text{font-size:14px;font-weight:700;color:var(--text);}
.single-display .arrow{font-size:10px;color:var(--sub);}
.code-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.code-chip{display:inline-flex;align-items:center;justify-content:center;padding:6px 10px;border-radius:6px;background:var(--card2);font-size:13px;font-weight:700;cursor:pointer;word-break:break-all;}
.code-chip.on{background:var(--accent);color:#fff}
.code-empty{text-align:center;color:var(--sub);font-size:12px;padding:10px 0;width:100%}
.add-row{display:flex;gap:6px}
.add-row button{width:56px;height:40px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0;}
.tip{font-size:11px;color:var(--sub);margin-top:4px;text-align:right}
.fb-boxes{display:grid;grid-template-columns:1fr;gap:6px}
.fb-box{border-radius:8px;padding:8px 10px;background:var(--card2)}
.fb-box.has{background:var(--accent-l)}
.fb-box .fb-box-hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.fb-box.has .fb-box-hd{color:var(--accent)}
.fb-box .fb-box-body{font-size:13px;font-weight:700;color:var(--text);word-break:break-all}
.fb-box .fb-box-body.none{color:#a0b0a6;font-weight:500}
.time-picker{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px;background:var(--card2);border-radius:10px;margin-bottom:10px;}
.time-col{display:flex;align-items:center;gap:6px}
.time-col .tp-btn{width:32px;height:32px;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:16px;font-weight:700;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.time-col .tp-show{width:80px;height:40px;line-height:40px;text-align:center;border-radius:8px;background:var(--accent-l);color:var(--accent);font-size:18px;font-weight:800;border:1px solid transparent;}
.time-sep{font-size:16px;font-weight:700;color:var(--sub)}
.time-refresh-bar{margin-top:-2px;margin-bottom:10px;}
.time-refresh-btn{width:100%;height:38px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 12px rgba(41,107,72,.25);}
.time-refresh-btn:active{transform:scale(0.97);background:var(--accent-d);}
.time-refresh-btn .rt{font-size:15px;}
.bp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bp-item{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:8px;padding:6px 8px}
.bp-item .bp-name{font-size:13px;font-weight:700;color:var(--text)}
.bp-item .bp-controls{display:flex;align-items:center;gap:6px}
.bp-item .bp-btn{width:32px;height:32px;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:18px;font-weight:800;color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.bp-item .bp-val{width:36px;height:32px;text-align:center;font-size:15px;font-weight:800;border-radius:6px;background:#fff;color:var(--text);outline:none;padding:0;border:1px solid transparent;}
.bp-item.has{background:var(--accent-l)}
.bp-item.has .bp-val{background:transparent}
.bp-actions{display:flex;gap:10px;margin-top:12px}
.bp-actions .btn-record{flex:1;height:44px;border-radius:10px;font-size:15px;font-weight:700;background:var(--accent);color:#fff;border:none;cursor:pointer;}
.bp-actions .btn-clear{flex:1;height:44px;border-radius:10px;font-size:15px;font-weight:700;background:var(--danger-l);color:var(--danger);border:none;cursor:pointer;}
.bp-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.bp-table{width:100%;border-collapse:collapse;font-size:12.5px;text-align:center;white-space:nowrap;}
.bp-table th{color:var(--sub);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);background:#f0f3ec;}
.bp-table td{padding:8px 6px;border-bottom:1px solid var(--line);font-weight:600;color:var(--text);}
.bp-table tbody tr:active{background:#f6f9f4;}
.bp-table .del{color:var(--danger);font-size:16px;cursor:pointer;}
.bp-total{margin-bottom:10px;font-size:13px;color:var(--accent);font-weight:800;background:var(--accent-l);padding:8px 12px;border-radius:8px;line-height:1.5;}
.bp-empty{text-align:center;color:var(--sub);font-size:13px;padding:12px 0}
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.mask.open{display:flex}
.modal{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:400px;max-height:85vh;display:flex;flex-direction:column}
.modal h2{font-size:16px;font-weight:800;margin-bottom:16px;text-align:center}
.modal-body{overflow-y:auto;flex:1;min-height:0}
.modal-foot{display:flex;gap:10px;margin-top:16px;flex-shrink:0}
.modal-foot button{flex:1;height:44px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;}
.modal-foot .ok{background:var(--accent);color:#fff}
.modal-foot .cancel{background:var(--card2);color:var(--text)}
.at-grid{display:flex;flex-wrap:wrap;gap:8px}
.at-chip{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 12px;border-radius:6px;background:var(--card2);border:none;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;}
.at-chip.on{background:var(--accent);color:#fff}
.at-none{font-size:13px;color:var(--sub);padding:8px 0;text-align:center}
.at-item{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:8px;padding:8px 12px;margin-bottom:6px}
.at-item .nm{font-size:14px;font-weight:700;word-break:break-all;flex:1;min-width:0;}
.at-item .x{width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;background:#fff;color:var(--danger);font-size:14px;cursor:pointer;flex-shrink:0;margin-left:8px;}
.alert-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.alert-mask.open{display:flex;animation:fadeIn .2s;}
.alert-box{background:var(--card);border-radius:20px;padding:24px 20px;width:100%;max-width:320px;text-align:center;box-shadow:0 10px 40px rgba(192,92,92,.5);border:2px solid var(--danger);}
.alert-box h2{color:var(--danger);font-size:22px;font-weight:900;margin-bottom:10px;}
.alert-box p{font-size:15px;color:var(--text);line-height:1.6;margin-bottom:20px;font-weight:600;}
.alert-box button{width:100%;height:50px;border:none;border-radius:12px;background:var(--danger);color:#fff;font-size:18px;font-weight:800;cursor:pointer;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.recognize-btn{width:100%;height:44px;border-radius:10px;background:var(--card);border:2px dashed var(--accent);color:var(--accent);font-size:15px;font-weight:800;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px;}
.recognize-btn:active{background:var(--accent-l);}
.recognize-btn .ic{font-size:20px;}
.ocr-tip{font-size:12px;color:var(--sub);line-height:1.6;background:var(--orange-l);border-radius:8px;padding:8px 10px;margin-bottom:10px;border-left:3px solid var(--orange);}
.ocr-tip b{color:var(--orange);}
.ocr-result-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.ocr-result-item{display:flex;align-items:center;justify-content:space-between;background:var(--accent-l);border-radius:8px;padding:8px 12px;cursor:pointer;}
.ocr-result-item .code{font-size:14px;font-weight:800;color:var(--accent);word-break:break-all;line-height:1.4;}
.ocr-result-item .type{font-size:11px;color:var(--sub);font-weight:600;margin-top:2px;}
.ocr-result-item .chk{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:10px;}
.ocr-result-item.off{background:var(--card2);opacity:0.6;}
.ocr-result-item.off .code{color:var(--sub);text-decoration:line-through;}
.ocr-result-item.off .chk{background:var(--gray);}
.ocr-empty{text-align:center;color:var(--sub);font-size:13px;padding:14px 0;}
.ocr-parse-btn{width:100%;height:42px;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;margin-top:10px;}
.ocr-parse-btn:active{background:var(--accent-d);}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--accent);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;font-weight:700;z-index:10000;opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 6px 20px rgba(41,107,72,.4);max-width:90vw;text-align:center;line-height:1.5;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{background:var(--danger);box-shadow:0 6px 20px rgba(192,92,92,.4);}
/* ---- v2 改进及顶部留白修复 ---- */
.app{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.top-nav-wrap{position:fixed;top:auto;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.18)}
.nav-icons button{height:48px;font-size:14px;line-height:1;letter-spacing:.5px}
.at-btn{width:48px;height:48px}
.page{padding-top:12px;padding-bottom:12px;}
#toast{top:calc(14px + env(safe-area-inset-top))}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-reset{background:var(--danger-l);color:var(--danger)}
.actions button{height:48px;font-size:16px}
.actions button:disabled,.big-copy:disabled{opacity:.5}
.quick button{height:40px}
.clear{padding:5px 10px;font-size:12px}
.field input.over{border-color:var(--orange);background:var(--orange-l)}
.hitem .del{width:34px;height:34px;line-height:32px;font-size:20px;top:6px;right:6px}
.hitem .header-row{padding-right:36px}
.hitem.is-done .stamp-done{color:var(--danger)!important}
.code-chip{min-height:36px;padding:6px 4px 6px 12px
